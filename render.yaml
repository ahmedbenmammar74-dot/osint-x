services:
  - type: web
    name: osint-x
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SITE_URL
        value: https://osint-x.fr
      - key: DATA_DIR
        value: /opt/data
    disk:
      name: osintx-data
      mountPath: /opt/data
      sizeGB: 1
